name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 纯 node 的静态校验：不需要 Xcode、不需要 Mac，几秒钟就能跑完。
  # 放在最前面，代码写坏 / 验包器写空 这类问题在这里就拦掉。
  # ---------------------------------------------------------------------------
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift 源码体检
        run: node scripts/lint-swift.js

      - name: 图标生成器自检（SDF 几何 + PNG 编码）
        run: node scripts/make-icons.js --selftest

      - name: 打包/验包流水线自检（正例过 + 反例必须被拦下）
        run: node scripts/selftest-pipeline.js

  # ---------------------------------------------------------------------------
  # iOS App → .ipa（TrollStore 直接装）
  # ---------------------------------------------------------------------------
  app:
    needs: selftest
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # arm64 兼容性最好（arm64e 机型也能跑 arm64）；arm64e 额外出一份备用
        arch: [arm64, arm64e]

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      # ldid 把 entitlement 写进二进制 —— 这是「读剪贴板不弹提示」的唯一开关。
      # runner 上通常没有，先从源码构建（要 libplist），失败再退回预编译二进制。
      - name: 准备 ldid
        run: |
          set -e
          if command -v ldid >/dev/null 2>&1; then
            echo "runner 已自带 ldid"; ldid -v 2>&1 | head -3 || true; exit 0
          fi

          built=0
          if brew install libplist openssl@3 2>/dev/null; then
            git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src || true
            if [ -d /tmp/ldid-src ]; then
              if (
                cd /tmp/ldid-src
                export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libplist)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
                make -j"$(sysctl -n hw.ncpu)" \
                  LIBPLIST_INCLUDES="-I$(brew --prefix libplist)/include -I$(brew --prefix libplist)/include/plist" \
                  LIBPLIST_LIBS="-L$(brew --prefix libplist)/lib -lplist-2.0" \
                  LIBCRYPTO_INCLUDES="-I$(brew --prefix openssl@3)/include" \
                  LIBCRYPTO_LIBS="-L$(brew --prefix openssl@3)/lib -lcrypto"
              ); then
                sudo install -m 755 /tmp/ldid-src/ldid /usr/local/bin/ldid
                built=1
              fi
            fi
          fi

          if [ "$built" != "1" ]; then
            echo "::warning::源码构建 ldid 失败，改用 rpetrich/ldid 的预编译二进制"
            curl -fsSL -o /tmp/ldid https://github.com/rpetrich/ldid/raw/master/ldid
            sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          fi

          ldid -v 2>&1 | head -3 || true

      # build-app.sh 内部会复核签名里的 entitlement、并用 verify-ipa.js 验包
      - name: 构建 App + 签名 + 打 ipa + 验包（${{ matrix.arch }}）
        run: bash scripts/build-app.sh --arch ${{ matrix.arch }}

      - name: 重命名产物以区分架构
        run: |
          set -e
          for f in dist/SyncClipboard_*.ipa; do
            base="${f%.ipa}"
            mv "$f" "${base}_${{ matrix.arch }}.ipa"
          done
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.arch }}
          path: dist/*.ipa
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 越狱守护进程 → .deb（当前用不上，保留；将来若越狱可直接用）
  # ---------------------------------------------------------------------------
  daemon:
    needs: selftest
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64e, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 ldid
        run: |
          set -e
          if command -v ldid >/dev/null 2>&1; then exit 0; fi
          built=0
          if brew install libplist openssl@3 2>/dev/null; then
            git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid-src || true
            if [ -d /tmp/ldid-src ]; then
              if (
                cd /tmp/ldid-src
                export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libplist)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
                make -j"$(sysctl -n hw.ncpu)" \
                  LIBPLIST_INCLUDES="-I$(brew --prefix libplist)/include -I$(brew --prefix libplist)/include/plist" \
                  LIBPLIST_LIBS="-L$(brew --prefix libplist)/lib -lplist-2.0" \
                  LIBCRYPTO_INCLUDES="-I$(brew --prefix openssl@3)/include" \
                  LIBCRYPTO_LIBS="-L$(brew --prefix openssl@3)/lib -lcrypto"
              ); then
                sudo install -m 755 /tmp/ldid-src/ldid /usr/local/bin/ldid
                built=1
              fi
            fi
          fi
          if [ "$built" != "1" ]; then
            curl -fsSL -o /tmp/ldid https://github.com/rpetrich/ldid/raw/master/ldid
            sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          fi

      - name: 构建守护进程 + 签名 + 打 deb + 验包（${{ matrix.arch }}）
        run: bash scripts/build.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 30

  # ---------------------------------------------------------------------------
  release:
    needs: [app, daemon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
