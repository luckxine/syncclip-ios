name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 纯 node 的静态校验：不需要 Xcode、不需要 Mac，几秒就跑完。
  # 放在最前面，代码写坏 / 验包器写空 这类问题在这里就拦掉。
  # ---------------------------------------------------------------------------
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift 源码体检
        run: node scripts/lint-swift.js

      - name: 图标生成器自检（SDF 几何 + PNG 编码）
        run: node scripts/make-icons.js --selftest

      - name: 打包/验包流水线自检（正例过 + 反例必须被拦下）
        run: node scripts/selftest-pipeline.js

  # ---------------------------------------------------------------------------
  # 工具链冒烟测试：确认「SwiftPM 交叉编译到 iOS」+「ldid 写 entitlement」
  # 这两件事在这个 runner 上真的成立。
  #
  # 为什么要单独一个 job：这两件事是整条链的上游。它们不成立的话，后面的
  # App 构建只会给出一个含糊的失败；而这里能给出精确的答案 —— 到底是环境问题
  # 还是我们的代码问题。而且这个 job 只花一分钟，比等 App 构建完再失败划算。
  # ---------------------------------------------------------------------------
  toolchain:
    needs: selftest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 准备 ldid（带功能冒烟测试）
        run: bash scripts/setup-ldid.sh

      - name: 验证 SwiftPM 能交叉编译到 iOS
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > probe.swift <<'EOF'
          import Foundation
          import UIKit
          print(UIApplication.shared.supportedInterfaceOrientations)
          EOF
          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 probe.swift -o probe-ios
          file probe-ios
          lipo -archs probe-ios

      - name: 验证 ldid 能把 entitlement 写进二进制并读回
        run: |
          set -e
          cd /tmp/probe
          cat > probe.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.Pasteboard.background-access</key><true/>
          </dict>
          </plist>
          EOF
          ldid -Sprobe.entitlements probe-ios
          echo "--- 读回的 entitlement："
          ldid -e probe-ios
          ldid -e probe-ios | grep -q 'com.apple.Pasteboard.background-access'
          echo "✅ 交叉编译 + entitlement 签名 都可用"

  # ---------------------------------------------------------------------------
  # iOS App → .ipa（TrollStore 直接装）
  # ---------------------------------------------------------------------------
  app:
    needs: toolchain
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # arm64 兼容性最好（arm64e 机型也能跑 arm64）；arm64e 额外出一份备用
        arch: [arm64, arm64e]

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 准备 ldid（带功能冒烟测试）
        run: bash scripts/setup-ldid.sh

      # build-app.sh 内部会复核签名里的 entitlement、并用 verify-ipa.js 验包
      - name: 构建 App + 签名 + 打 ipa + 验包（${{ matrix.arch }}）
        run: bash scripts/build-app.sh --arch ${{ matrix.arch }}

      - name: 重命名产物以区分架构
        run: |
          set -e
          for f in dist/SyncClipboard_*.ipa; do
            mv "$f" "${f%.ipa}_${{ matrix.arch }}.ipa"
          done
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.arch }}
          path: dist/*.ipa
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 越狱守护进程 → .deb（当前用不上，保留；将来若越狱可直接用）
  # ---------------------------------------------------------------------------
  daemon:
    needs: toolchain
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64e, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 ldid（带功能冒烟测试）
        run: bash scripts/setup-ldid.sh

      - name: 构建守护进程 + 签名 + 打 deb + 验包（${{ matrix.arch }}）
        run: bash scripts/build.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 30

  # ---------------------------------------------------------------------------
  release:
    needs: [app, daemon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
